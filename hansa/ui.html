<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<style>
:root { --bg:#f7f7f4; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e1db; --card:#fff; --accent:#2f5d8a; --warn:#9a5a00; --bad:#b3261e; --ok:#2e7d32; }
@media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecebe6; --muted:#a3a29c; --line:#2f2e2b; --card:#1e1e1c; --accent:#8ab4e0; --warn:#e0a458; --bad:#f28b82; --ok:#81c995; } }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; background:var(--bg); color:var(--fg); }
header { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
nav { display:flex; gap:4px; }
nav button { border:none; background:none; padding:6px 10px; border-radius:6px; color:var(--muted); }
nav button.on { background:var(--bg); color:var(--fg); font-weight:600; }
main { max-width:1100px; margin:0 auto; padding:16px; }
section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:14px; }
h2 { font-size:15px; margin:0 0 8px; }
h3 { font-size:14px; margin:12px 0 6px; }
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:500; border-top:none; white-space:nowrap; }
input, select, textarea { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--fg); max-width:100%; }
input[type=number] { width:90px; }
textarea { width:100%; min-height:84px; font:13px/1.45 ui-monospace,Menlo,monospace; }
button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--fg); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.link { border:none; background:none; color:var(--accent); padding:0; text-decoration:underline; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.grid { display:grid; grid-template-columns: max-content 1fr; gap:6px 12px; align-items:center; }
.muted { color:var(--muted); } .bad { color:var(--bad); } .ok { color:var(--ok); } .warn { color:var(--warn); }
.mono { font:13px/1.45 ui-monospace,Menlo,monospace; }
pre { white-space:pre-wrap; word-break:break-word; margin:0; }
.lane { border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:8px 0; }
.facts { display:grid; grid-template-columns: minmax(0, 24em) 1fr; gap:6px 12px; align-items:start; }
.facts > .muted { font-size:13px; }
.bar { position:sticky; bottom:0; background:var(--bg); padding:10px 0; }
@media (max-width:640px) { main { padding:10px; } .grid, .facts { grid-template-columns:1fr; } th, td { padding:5px 4px; } }
</style>
</head>
<body>
<header>
  <strong id="title"></strong>
  <nav id="tabs"></nav>
  <span id="state" class="muted"></span>
</header>
<main>
  <div id="tab-status"></div>
  <div id="tab-settings" hidden></div>
  <div id="tab-cost" hidden></div>
</main>

        h("div", {class:"facts"}, laneFields(l).map(([k, v]) => [h("span", {class:"muted"}, LANE_LABELS[k] || k), h("pre", {class:"mono"}, v)])))),
      h("h3", {}, T.laneCommands), h("p", {class:"muted"}, T.laneCommandsNote),
      LANE_CMDS.length ? table([T.at, T.lane, T.field, T.change], LANE_CMDS.map(e => [when(e.ts), e.lane, (CHANGE_LABELS[changedField(e)] || changedField(e)) + (e.target ? ` · ${T.releaseTarget} ${e.target}` : ""),
        h("span", {class:"mono"}, `${JSON.stringify(e.old ?? "")} -> ${JSON.stringify(e.new ?? "")}`)])) : h("p", {class:"muted"}, T.none)),
    section(T.general, h("div", {class:"grid"},
      T.concurrency, h("div", {}, h("strong", {}, S.concurrency), " ", h("span", {class:"muted"}, T.concurrencyNote)),
      T.coolMinutes, bind(S, "cool_minutes", "number"),
      T.coordinator, h("div", {class:"row"}, pick(S.coordinator, "provider", Object.keys(S.providers), Object.keys(S.providers)),
        T.model, bind(S.coordinator, "model"), T.effort, pick(S.coordinator, "effort", EFFORTS)),
      T.auditsCost, bind(S.coordinator, "audits_cost", "bool"),
      T.designSeat, (S.design = S.design || {provider:"", model:"", effort:""}, h("div", {class:"row"},
        pick(S.design, "provider", ["", ...Object.keys(S.providers)], [T.effortDefault, ...Object.keys(S.providers)]),
        T.model, bind(S.design, "model"), T.effort, pick(S.design, "effort", EFFORTS))),
      T.browserCmd, bind(S, "browser"),
      T.coordinatorRead, h("textarea", {placeholder:"/opt/include", oninput: e => {
        S.coordinator_read = e.target.value.split("\n").map(x => x.trim()).filter(x => x); }}, (S.coordinator_read || []).join("\n")),
      ...(READ_SKIPPED.length ? [T.coordinatorReadSkipped, h("ul", {}, READ_SKIPPED.map(p => h("li", {class:"bad"}, p)))] : []),
      T.workersMayNotRead, h("textarea", {placeholder:"/Users/me/.config/myproject/keys", oninput: e => {
        S.workers_may_not_read = e.target.value.split("\n").map(x => x.trim()).filter(x => x); }}, (S.workers_may_not_read || []).join("\n")),
      ...(DENY_SKIPPED.length ? [T.workersMayNotReadSkipped, h("ul", {}, DENY_SKIPPED.map(p => h("li", {class:"bad"}, p)))] : []))),
    section(T.releases, h("div", {class:"grid"},
      /* the list holds each release target as it was when saved (the lane's repository and base branch, the
         target's command and the target it must follow); one ticked here, or taken back in, is recorded as it is
         when Save is pressed */
      T.releasesWithoutAsking, releaseTicks(),
      ...(RELEASE_UNMATCHED.length ? [T.releaseUnmatched, h("div", {},
        h("ul", {}, RELEASE_UNMATCHED.map(u => h("li", {class:"bad"}, `${u.lane}${u.target ? ` · ${T.releaseTarget} ${u.target}` : ""}: ${(ZH && u.why_zh) || u.why}`))),
        h("button", {onclick: e => { S.releases_without_asking = (S.releases_without_asking || []).map(listedKey).map(([lane, target]) => ({lane, target}));
          e.target.disabled = true; }}, T.releaseTakeBack))] : []),
      T.releaseForbidden, h("textarea", {placeholder:"internal-only", oninput: e => {
        S.release_forbidden = e.target.value.split("\n").map(x => x.trim()).filter(x => x); }}, (S.release_forbidden || []).join("\n")))),
    alertSection(),
    section(T.prices, h("p", {class:"muted"}, T.pricesNote),
      table([T.model, T.in, T.out, T.cacheRead, T.cacheWrite, T.cacheWrite1h, ""], Object.entries(S.prices).map(([m, p]) =>
        [m, bind(p, "in", "number"), bind(p, "out", "number"), bind(p, "cache_read", "number"), bind(p, "cache_write", "number"),
         bind(p, "cache_write_1h", "number"), h("button", {onclick: () => { delete S.prices[m]; renderSettings(); }}, T.remove)])),
      h("div", {class:"row"}, newPrice, h("button", {onclick: () => { const n = newPrice.value.trim();
        if (n && !S.prices[n]) { S.prices[n] = {in:0, out:0}; renderSettings(); } }}, T.addPrice))),
    h("div", {class:"row bar"},
      h("button", {class:"primary", onclick: async () => {
        try { const r = await api("/api/settings", {settings:S, rev:REV});
          if (r.ok) { await loadSettings(); msg.textContent = T.saved; msg.className = "ok"; $("#tab-settings").append(msg); }
          else { renderSettings(r.problems); window.scrollTo(0, 0); } } catch (e) { err(e); } }}, T.save),
      h("button", {onclick: () => loadSettings()}, T.reload), msg)
  );
}

/* ---------- cost ---------- */
let costDays = 7;
async function loadCost() {
  const r = await api("/api/cost?days=" + costDays);
  const seatName = k => k.startsWith("helper:") ? `${T.seat_helper}: ${T["helper_" + k.slice(7)] || k.slice(7)}` : T["seat_" + k] || k;
  const block = key => {
    const rows = Object.entries(r.by[key] || {});
    if (!rows.length) return null;
    return h("div", {}, h("h3", {}, T["by" + key]), table(["", T.tokens, "$ " + T.listValue, T.tokensNoPrice],
      rows.map(([k, v]) => [key === "seat" ? seatName(k) : (k || "-"), fmt(v.tokens), v.usd.toFixed(2), v.unpriced_tokens ? fmt(v.unpriced_tokens) : ""])));
  };
  $("#tab-cost").replaceChildren(
    h("section", {},
      h("div", {class:"row"}, T.days, pick({d:String(costDays)}, "d", ["1", "7", "30"], ["1", "7", "30"]), T.daysUnit,
        h("strong", {}, `${T.total}: ${fmt(r.total.tokens)} ${T.tokens} · $${r.total.usd.toFixed(2)} ${T.listValue}`),
        h("button", {onclick: exportCsv}, T.export)),
      h("p", {class:"muted"}, T.costNote),
      r.coordinator_uncounted ? h("p", {class:"warn"}, ZH ? T.coordinatorUncounted.replaceAll("{user}", r.coordinator_user) : r.coordinator_uncounted) : null,
      r.unpriced_models.length ? h("p", {class:"warn"}, T.unpriced + " " + r.unpriced_models.join(", ") + " — " + T.setPrice) : null),
    section(T.cost, ["seat", "day", "model", "lane", "provider", "task"].map(block)));
  const sel = $("#tab-cost select");
  sel.addEventListener("change", e => { costDays = Number(e.target.value); loadCost().catch(err); });
}
async function exportCsv() {
  const r = await api(`/api/cost?days=${costDays}&rows=1`);
  const cols = ["day", "seat", "lane", "task", "provider", "model", "in", "out", "cache_read", "cache_write", "usd", "priced_by"];
  const esc = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [cols.join(",")].concat(r.rows.map(x => cols.map(c => esc(x[c])).join(","))).join("\n");
  const a = h("a", {href:URL.createObjectURL(new Blob([csv], {type:"text/csv"})), download:`cost-${costDays}d.csv`});
  document.body.append(a); a.click(); a.remove();
}

/* ---------- start ---------- */
document.title = T.title;
$("#title").textContent = T.title;
for (const tab of ["status", "settings", "cost"])
  $("#tabs").append(h("button", {"data-tab":tab, onclick: () => show(tab)}, T[tab]));
if (location.search.includes("t=")) history.replaceState(null, "", "/");
show("status");
setInterval(() => {
  const typing = $("#tab-status").contains(document.activeElement) && document.activeElement.tagName === "INPUT";
  if (current === "status" && !document.hidden && !typing) loadStatus().catch(err);
}, 5000);
</script>
