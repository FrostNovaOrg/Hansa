<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<style>
:root { --bg:#f7f7f4; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e1db; --card:#fff; --accent:#2f5d8a; --warn:#9a5a00; --bad:#b3261e; --ok:#2e7d32; }
@media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecebe6; --muted:#a3a29c; --line:#2f2e2b; --card:#1e1e1c; --accent:#8ab4e0; --warn:#e0a458; --bad:#f28b82; --ok:#81c995; } }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; background:var(--bg); color:var(--fg); }
/* a command, path or ref of any length breaks inside its box rather than widening it past the page */
body, td, label, code, .mono { overflow-wrap:anywhere; }
header { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
nav { display:flex; gap:4px; }
nav button { border:none; background:none; padding:6px 10px; border-radius:6px; color:var(--muted); }
nav button.on { background:var(--bg); color:var(--fg); font-weight:600; }
main { max-width:1100px; margin:0 auto; padding:16px; }
section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:14px; }
h2 { font-size:15px; margin:0 0 8px; }
h3 { font-size:14px; margin:12px 0 6px; }
.scroll { overflow-x:auto; max-width:100%; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:500; border-top:none; white-space:nowrap; }
input, select, textarea { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--fg); max-width:100%; }
input[type=number] { width:90px; }
textarea { width:100%; min-height:84px; font:13px/1.45 ui-monospace,Menlo,monospace; }
button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--fg); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.link { border:none; background:none; color:var(--accent); padding:0; text-decoration:underline; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
/* grid and flex children may shrink below their content, so nothing pushes a control out of the page */
.row > *, .grid > *, .facts > * { min-width:0; }
.grid { display:grid; grid-template-columns: fit-content(22em) minmax(0, 1fr); gap:6px 12px; align-items:center; }
.muted { color:var(--muted); } .bad { color:var(--bad); } .ok { color:var(--ok); } .warn { color:var(--warn); }
.mono { font:13px/1.45 ui-monospace,Menlo,monospace; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; }
.lane { border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:8px 0; }
.facts { display:grid; grid-template-columns: minmax(0, 24em) minmax(0, 1fr); gap:6px 12px; align-items:start; }
.facts > .muted { font-size:13px; }
.bar { position:sticky; bottom:0; background:var(--bg); padding:10px 0; }
/* one release target's tick: the box keeps its size, the words beside it wrap */
.tick { display:flex; gap:6px; align-items:baseline; margin:2px 0; cursor:pointer; }
.tick > input { flex:none; margin:0; }
.tick > span { min-width:0; }
img { max-width:100%; }
@media (max-width:640px) { main { padding:10px; } .grid, .facts { grid-template-columns:minmax(0, 1fr); } th, td { padding:5px 4px; } }
</style>
</head>
<body>
<header>
  <strong id="title"></strong>
  <nav id="tabs"></nav>
  <span id="state" class="muted"></span>
</header>
<main>
  <div id="tab-status"></div>
  <div id="tab-settings" hidden></div>
  <div id="tab-cost" hidden></div>
</main>

    const tries = key === "task";  // every run of a task counts: its earlier tries too
    return h("div", {}, h("h3", {}, T["by" + key]), table(["", T.tokens, "$ " + T.listValue, T.tokensNoPrice, ...(tries ? [T.runs, T.turns] : [])],
      rows.map(([k, v]) => [key === "seat" ? seatName(k) : (k || "-"), fmt(v.tokens), v.usd.toFixed(2), v.unpriced_tokens ? fmt(v.unpriced_tokens) : "",
        ...(tries ? [v.runs ? fmt(v.runs) : "", v.runs ? fmt(v.turns) : ""] : [])])));
  };
  $("#tab-cost").replaceChildren(...shown([
    h("section", {},
      h("div", {class:"row"}, T.days, pick({d:String(costDays)}, "d", ["1", "7", "30"], ["1", "7", "30"]), T.daysUnit,
        h("strong", {}, `${T.total}: ${fmt(r.total.tokens)} ${T.tokens} · $${r.total.usd.toFixed(2)} ${T.listValue}`),
        h("button", {onclick: exportCsv}, T.export)),
      h("p", {class:"muted"}, T.costNote),
      r.coordinator_uncounted ? h("p", {class:"warn"}, ZH ? T.coordinatorUncounted.replaceAll("{user}", r.coordinator_user) : r.coordinator_uncounted) : null,
      r.unpriced_models.length ? h("p", {class:"warn"}, T.unpriced + " " + r.unpriced_models.join(", ") + " — " + T.setPrice) : null),
    section(T.cost, ["seat", "day", "model", "lane", "provider", "task"].map(block))]));
  const sel = $("#tab-cost select");
  sel.addEventListener("change", e => { costDays = Number(e.target.value); loadCost().catch(err); });
}
async function exportCsv() {
  const r = await api(`/api/cost?days=${costDays}&rows=1`);
  const cols = ["day", "seat", "lane", "task", "provider", "model", "in", "out", "cache_read", "cache_write", "usd", "priced_by", "runs", "turns"];
  const esc = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [cols.join(",")].concat(r.rows.map(x => cols.map(c => esc(x[c])).join(","))).join("\n");
  const a = h("a", {href:URL.createObjectURL(new Blob([csv], {type:"text/csv"})), download:`cost-${costDays}d.csv`});
  document.body.append(...shown([a])); a.click(); a.remove();
}

/* ---------- start ---------- */
document.title = T.title;
$("#title").textContent = T.title;
for (const tab of ["status", "settings", "cost"])
  $("#tabs").append(...shown([h("button", {"data-tab":tab, onclick: () => show(tab)}, T[tab])]));
if (location.search.includes("t=")) history.replaceState(null, "", "/");
show("status");
setInterval(() => {
  const typing = $("#tab-status").contains(document.activeElement) && document.activeElement.tagName === "INPUT";
  if (current === "status" && !document.hidden && !typing) loadStatus().catch(err);
}, 5000);
</script>
</body>
