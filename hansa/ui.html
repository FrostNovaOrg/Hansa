<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hansa</title>
<style>
:root { color-scheme:light; --bg:#f8f9fb; --fg:#20232c; --muted:#626878; --line:#e1e4eb; --control-line:#b5bdcb; --card:#fff; --surface:#f0f2f6; --input:#fcfcfd; --accent:#365fc9; --link:#365fc9; --tint:#edf2ff; --warn:#875800; --bad:#b3261e; --ok:#236d47; --warn-bg:#fff7e6; --bad-bg:#fff1f0; --ok-bg:#edf8f1; --shadow:0 2px 8px #18223b04; --header-height:64px; }
@media (prefers-color-scheme: dark) { :root { color-scheme:dark; --bg:#101114; --fg:#f0f1f4; --muted:#a6aab7; --line:#2e313b; --control-line:#555d70; --card:#191b21; --surface:#22252d; --input:#121419; --accent:#4267cc; --link:#abc4ff; --tint:#222e49; --warn:#e6bd77; --bad:#ffa59e; --ok:#8cd6ad; --warn-bg:#2e2619; --bad-bg:#302024; --ok-bg:#1a2b23; --shadow:0 2px 8px #00000012; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; background:var(--bg); color:var(--fg); }
/* Long commands and paths stay inside the page. */
body, td, label, code, .mono { overflow-wrap:anywhere; }
header { display:grid; grid-template-columns:minmax(90px,160px) minmax(0,max-content) minmax(100px,1fr) auto auto; gap:20px; align-items:center; padding:12px 24px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
#title { display:flex; align-items:center; gap:9px; min-width:0; font-size:15px; letter-spacing:-.3px; white-space:nowrap; }
.brand-mark { display:grid; place-items:center; flex:none; width:27px; height:27px; border-radius:8px; background:var(--fg); color:var(--card); font-size:15px; font-weight:700; }
.brand-label { display:flex; flex-direction:column; min-width:0; line-height:1.3; }
.brand-caption { color:var(--muted); font-size:12px; font-weight:400; overflow:hidden; text-overflow:ellipsis; }
nav { display:flex; gap:4px; }
#tabs { min-width:0; max-width:100%; overflow-x:auto; padding:3px; background:var(--surface); border:1px solid var(--line); border-radius:9px; }
#tabs button { flex:none; white-space:nowrap; }
nav button { display:flex; gap:7px; align-items:center; border:1px solid transparent; background:none; padding:6px 11px; border-radius:6px; color:var(--muted); }
nav button.on { background:var(--card); border-color:var(--line); color:var(--fg); font-weight:600; box-shadow:var(--shadow); }
#state { display:flex; align-items:center; gap:7px; min-width:0; height:30px; font-size:12px; }
#state-window { flex:1; min-width:0; overflow:hidden; white-space:nowrap; }
#state-text { display:inline-block; white-space:nowrap; }
#state-toggle, #language, #github { flex:none; width:30px; min-height:30px; padding:4px; }
#github { display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--fg); }
#github:hover { border-color:var(--control-line); background:var(--surface); }
.header-menu { position:absolute; top:100%; right:12px; z-index:6; margin:6px 0 0; padding:10px; border:1px solid var(--line); border-radius:9px; background:var(--card); box-shadow:var(--shadow); max-width:calc(100% - 24px); max-height:70vh; overflow:auto; }
#state-list { width:620px; list-style:none; }
#state-list li { display:flex; align-items:baseline; gap:7px; padding:5px; white-space:normal; }
#language-menu button { display:flex; width:100%; justify-content:flex-start; border:0; }
#language-menu [aria-current=true] { color:var(--link); background:var(--tint); }
#state::before { content:""; width:6px; height:6px; flex:none; border-radius:50%; background:var(--ok); }
#state.warn::before { background:var(--warn); } #state.bad::before { background:var(--bad); }
main { max-width:1240px; margin:0 auto; padding:30px 28px; }
section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
h2 { font-size:15px; margin:0 0 12px; } h3 { font-size:14px; margin:16px 0 8px; }
p { margin:8px 0; }
.scroll { overflow-x:auto; max-width:100%; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:9px 10px; border-top:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-size:12px; font-weight:500; border-top:none; white-space:nowrap; }
input, select, textarea { font:inherit; padding:8px 10px; border:1px solid var(--control-line); border-radius:7px; background:var(--input); color:var(--fg); max-width:100%; transition:border-color .14s, box-shadow .14s, background-color .14s; }
input::placeholder, textarea::placeholder { color:var(--muted); opacity:.8; }
input:hover, select:hover, textarea:hover { border-color:var(--muted); }
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color:var(--link); outline:0; box-shadow:0 0 0 3px var(--tint); }
input[type=number] { width:90px; }
input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
textarea { width:100%; min-height:104px; resize:vertical; font:13px/1.6 ui-monospace,Menlo,monospace; }
select { cursor:pointer; }
button { display:inline-flex; align-items:center; justify-content:center; gap:7px; font:inherit; font-size:13px; font-weight:500; padding:7px 11px; min-height:34px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--fg); cursor:pointer; transition:background-color .14s, border-color .14s, color .14s, box-shadow .14s; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.link { display:inline; min-height:0; border:none; background:none; color:var(--link); padding:0; text-decoration:underline; }
button:hover:not(:disabled) { border-color:var(--control-line); background:var(--surface); }
button.primary:hover:not(:disabled) { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 3px var(--tint); }
button:active:not(:disabled) { box-shadow:inset 0 1px 3px #00000012; }
button:disabled { cursor:default; opacity:.5; }
button.danger { color:var(--bad); }
:focus-visible { outline:2px solid var(--link); outline-offset:3px; }
[hidden] { display:none !important; }
.icon { display:inline-block; width:17px; height:17px; flex:none; vertical-align:middle; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
/* grid and flex children may shrink below their content. */
.row > *, .grid > *, .facts > * { min-width:0; }
.grid { display:grid; grid-template-columns: fit-content(22em) minmax(0, 1fr); gap:6px 12px; align-items:center; }
.muted { color:var(--muted); } .bad { color:var(--bad); } .ok { color:var(--ok); } .warn { color:var(--warn); }
.mono { font:12px/1.6 ui-monospace,Menlo,monospace; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; }
.lane { border:1px solid var(--line); border-radius:9px; padding:16px; margin:12px 0; }
.facts { display:grid; grid-template-columns: minmax(0, 24em) minmax(0, 1fr); gap:8px 16px; align-items:start; }
.facts > .muted { font-size:12px; }
.goal-detail { min-width:0; max-width:100%; }
.goal-detail summary { cursor:pointer; }
.goal-detail .goal-missing { background:var(--warn-bg); border-color:var(--warn); }
#tab-goals td:first-child { min-width:200px; }
#tab-goals td:last-child { min-width:180px; }
.tick { display:flex; gap:9px; align-items:baseline; margin:2px 0; cursor:pointer; }
.tick > input { flex:none; margin:0; }
.tick > span { min-width:0; }
.release-tick-info { flex:1; }
.release-tick-command { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* the command in "no description yet" is one piece: the line breaks around it, and a command wider than the
   screen scrolls inside its own box rather than widening the page */
.release-about-command { display:inline-block; max-width:100%; overflow-x:auto; vertical-align:bottom; white-space:nowrap; }
.settings-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin:0 0 30px; }
.settings-head h1 { margin:0 0 8px; font-size:28px; line-height:1.3; font-weight:650; letter-spacing:-.7px; }
.settings-head p, .group-head p { margin:0; color:var(--muted); font-size:13px; max-width:68ch; }
.eyebrow { margin-bottom:10px; color:var(--muted); font-size:10px; font-weight:600; letter-spacing:.12em; }
.draft-badge { display:inline-flex; align-items:center; gap:6px; flex:none; font-size:12px; padding:6px 10px; border:1px solid var(--line); border-radius:20px; background:var(--card); }
.draft-badge .icon { width:14px; height:14px; }
.draft-badge[data-tone=dirty] { background:var(--warn-bg); border-color:var(--warn); color:var(--warn); }
.draft-badge[data-tone=error] { background:var(--bad-bg); color:var(--bad); }
.draft-badge[data-tone=success] { background:var(--ok-bg); color:var(--ok); }
.settings-layout { display:grid; grid-template-columns:202px minmax(0,1fr); gap:32px; align-items:start; }
.settings-nav { display:flex; flex-direction:column; gap:4px; position:sticky; top:calc(var(--header-height) + 24px); padding:4px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
.settings-nav button { position:relative; justify-content:flex-start; gap:10px; text-align:left; padding:10px 12px; min-height:42px; border:1px solid transparent; background:transparent; border-radius:7px; color:var(--muted); white-space:nowrap; }
.settings-nav button .icon { width:16px; height:16px; }
.settings-nav button.on { background:var(--tint); color:var(--fg); border-color:transparent; font-weight:600; box-shadow:none; }
.settings-nav button.on::before { content:""; position:absolute; left:-5px; top:12px; bottom:12px; width:2px; border-radius:2px; background:var(--link); }
.settings-nav button[data-dirty=true]::after { content:""; width:5px; height:5px; border-radius:50%; background:var(--warn); margin-left:auto; flex:none; }
.settings-content, .settings-form { min-width:0; }
.settings-form { border:0; padding:0; margin:0; }
.group-head { display:flex; gap:12px; align-items:flex-start; margin:0 0 20px; }
.group-symbol { display:grid; place-items:center; width:38px; height:38px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--muted); flex:none; }
.group-head h2 { font-size:19px; margin:0 0 4px; letter-spacing:-.3px; }
.settings-group > section { padding:20px; margin-bottom:16px; }
.settings-group section > h2 { font-size:13px; margin-bottom:18px; }
.settings-group .lane { padding:18px; margin:0 0 16px; background:var(--input); }
.card-head { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-bottom:20px; }
.card-head strong { font-size:14px; }
.card-head .card-actions { margin-left:auto; display:flex; gap:6px; }
.tag { font-size:10px; font-weight:500; padding:2px 7px; border:1px solid var(--line); border-radius:5px; color:var(--muted); background:var(--card); }
.form-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 20px; }
.field { display:flex; flex-direction:column; gap:7px; min-width:0; }
.field.wide { grid-column:1 / -1; }
.field-label { display:block; font-size:12px; font-weight:550; }
.field:focus-within > .field-label { color:var(--link); }
.field-note { color:var(--muted); font-size:12px; line-height:1.65; }
.field > input:not([type=checkbox]), .field > select, .field > textarea,
.field > div > input:not([type=checkbox]) { width:100%; min-width:0; padding:9px 11px; border-radius:7px; }
.field input[type=number] { width:100%; }
.field [aria-invalid=true] { border-color:var(--bad); }
.field-error { color:var(--bad); font-size:12px; margin:0; }
.settings-group .row > input:not([type=checkbox]) { flex:1; min-width:140px; }
.settings-group .row > button { flex:none; }
.add-row { margin-top:18px; padding-top:18px; border-top:1px dashed var(--line); }
.password-control { position:relative; flex:1; min-width:160px; }
.password-control input { width:100%; padding:9px 44px 9px 11px; min-width:0; }
.password-control button { position:absolute; top:4px; right:4px; width:32px; min-height:32px; padding:0; border:0; color:var(--muted); background:transparent; }
/* Long names, service choices and hidden addresses must fit a phone's width. */
section.push-addresses { overflow-wrap:anywhere; }
.push-addresses .password-control { min-width:0; width:100%; }
.push-entry { min-width:0; padding:18px 0; border-bottom:1px solid var(--line); }
.push-entry h3 { margin:0 0 8px; }
.push-entry .row { margin-top:12px; }
.push-addresses select { max-width:100%; }
.key-status { display:inline-flex; align-items:center; gap:5px; padding:3px 7px; border-radius:5px; font-size:11px; background:var(--surface); }
.help { margin:10px 0 0; font-size:12px; color:var(--muted); }
.help summary { display:flex; align-items:center; gap:7px; cursor:pointer; width:fit-content; font-weight:500; padding:3px 0; list-style:none; }
.help summary::-webkit-details-marker { display:none; }
.help summary::before { content:""; width:5px; height:5px; border:solid currentColor; border-width:0 1.5px 1.5px 0; transform:rotate(-45deg); transition:transform .14s; margin:0 3px; }
.help[open] > summary::before { transform:rotate(45deg); }
.help[open] > summary { margin-bottom:10px; color:var(--fg); }
.help p { margin:0; padding:12px 14px; background:var(--surface); border-radius:7px; line-height:1.8; }
.notice { padding:12px 14px; border:1px solid var(--line); border-radius:8px; font-size:12px; margin:0 0 16px; background:var(--surface); }
.notice p { margin:4px 0 0; color:var(--muted); }
.readonly-value { padding:10px 12px; background:var(--surface); border-radius:7px; font-size:16px; font-weight:600; }
.settings-group .facts { grid-template-columns:minmax(0,14em) minmax(0,1fr); gap:12px 20px; }
.settings-group .facts > .muted { font-size:12px; } .settings-group .facts > pre { font-size:12px; }
.settings-group .tick { padding:8px 0; }
#settings-prices table { min-width:840px; }
#settings-prices td:first-child { min-width:180px; }
#settings-prices button { white-space:nowrap; }
.settings-footer { display:flex; gap:12px; align-items:center; flex-wrap:wrap; position:sticky; bottom:12px; z-index:4; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:14px 16px; margin-top:20px; box-shadow:0 4px 20px #0000000a; }
.settings-footer .save-state { display:flex; align-items:center; gap:8px; margin-right:auto; font-size:12px; max-width:100%; }
.save-state .icon { width:16px; height:16px; }
.save-state[data-tone=dirty] { color:var(--warn); } .save-state[data-tone=success] { color:var(--ok); } .save-state[data-tone=error] { color:var(--bad); }
.settings-footer:has([data-tone=error]) { border-color:var(--bad); background:var(--bad-bg); }
.settings-footer button { min-height:36px; padding:8px 12px; }
.settings-errors { border-color:var(--bad); background:var(--bad-bg); }
.settings-errors h2 { display:flex; align-items:center; gap:8px; color:var(--bad); }
.settings-errors ul { padding-left:18px; margin:8px 0 0; }
.settings-errors button { display:inline; text-align:left; min-height:0; font-size:12px; padding:2px 0; border:0; color:var(--bad); background:transparent; text-decoration:underline; }
.page-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin:0 0 26px; }
.page-head h1 { margin:0 0 8px; font-size:28px; line-height:1.3; font-weight:650; letter-spacing:-.7px; }
.page-head p { margin:0; color:var(--muted); font-size:13px; max-width:68ch; }
.page-head > .status-pill { margin-top:4px; flex:none; }
.status-pill { display:inline-flex; align-items:center; gap:6px; width:fit-content; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--muted); font-size:11px; line-height:1.5; overflow-wrap:normal; }
.status-pill.ok { color:var(--ok); background:var(--ok-bg); border-color:transparent; }
.status-pill.warn { color:var(--warn); background:var(--warn-bg); border-color:transparent; }
.status-pill.bad { color:var(--bad); background:var(--bad-bg); border-color:transparent; }
.status-pill .icon { width:13px; height:13px; }
.dashboard-panel { padding:20px; margin-bottom:20px; }
.section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 16px; }
.section-head h2 { display:flex; align-items:center; gap:9px; margin:0; font-size:14px; }
.section-head h2 .icon { color:var(--muted); width:16px; height:16px; }
.count-badge { display:inline-flex; align-items:center; justify-content:center; min-width:24px; padding:1px 7px; border:1px solid var(--line); border-radius:5px; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
.metric-caption { margin:0 0 10px; color:var(--muted); font-size:12px; font-weight:500; }
.metric-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin:0 0 24px; }
.metric-card { min-width:0; border:1px solid var(--line); border-radius:11px; background:var(--card); padding:17px 18px; box-shadow:var(--shadow); }
.metric-label { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
.metric-label .icon { width:15px; height:15px; }
.metric-value { display:block; margin-top:7px; font-size:27px; font-weight:620; letter-spacing:-.6px; line-height:1.3; font-variant-numeric:tabular-nums; }
.metric-note { display:block; margin-top:5px; font-size:11px; color:var(--muted); }
.runtime-toolbar { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; }
.runtime-summary { min-width:0; flex:1; }
.runtime-summary h2 { margin:0 0 8px; font-size:14px; }
.runtime-summary p { font-size:12px; color:var(--muted); margin:7px 0 0; }
.runtime-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.runtime-actions input { min-width:180px; flex:1; }
.runtime-actions button { min-height:40px; }
.dashboard-panel table { font-size:12px; }
/* Status tables scroll as a unit; long values wrap without taking their neighbours' space. */
#tab-status table { min-width:680px; }
#tab-status td { min-width:6em; max-width:28em; }
#tab-status td button { white-space:nowrap; overflow-wrap:normal; }
.dashboard-panel th { padding-top:0; }
.dashboard-panel td { padding-top:12px; padding-bottom:12px; }
.dashboard-panel .mono { font-size:11px; }
.task-detail { border-left:2px solid var(--line); padding:10px 0 0 12px; margin-top:8px; min-width:0; max-width:100%; }
td .task-detail { min-width:200px; }
.task-steps { display:flex; flex-wrap:nowrap; overflow-x:auto; align-items:stretch; gap:8px; list-style:none; padding:0; margin:0 0 12px; max-width:100%; }
.task-step { flex:1 0 150px; min-width:0; max-width:100%; padding:8px; border:1px solid var(--line); border-radius:7px; overflow-wrap:anywhere; }
.task-step + .task-step::before { content:"→ "; }
.task-step > strong { font:600 12px/1.6 system-ui,sans-serif; }
.task-step > time, .task-step > small, .task-step > span { display:block; }
.task-step[aria-current=step] { border-color:var(--link); background:var(--tint); }
.task-relations { margin:0 0 8px; }
@media (max-width:640px) {
  .task-steps { flex-wrap:wrap; overflow-x:visible; }
  .task-step { flex:1 1 140px; }
}
.empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; padding:28px 16px; color:var(--muted); }
.empty-state > .icon { width:24px; height:24px; margin-bottom:12px; }
.empty-state strong { color:var(--fg); font-size:13px; font-weight:550; }
.empty-state p { margin:5px 0 0; max-width:54ch; font-size:12px; }
.request-card { padding:14px 0; border-top:1px solid var(--line); }
.request-card:first-of-type { border-top:0; padding-top:0; }
.request-body { display:flex; align-items:baseline; gap:9px; margin-bottom:10px; font-size:13px; }
.request-body strong { flex:none; color:var(--muted); font-size:12px; }
.request-card .row input { flex:1; min-width:180px; }
.request-card .field-note { margin-top:7px; }
.principal-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
.principal-actions > input { flex:1 1 180px; min-width:0; }
.principal-actions > button { max-width:100%; white-space:normal; }
.release-card > .principal-actions { flex-direction:column; align-items:flex-start; }
.release-refusal { display:flex; flex-wrap:nowrap; align-items:center; gap:8px; width:100%; max-width:28em; }
.release-refusal > input { flex:1; min-width:0; }
.release-refusal > button { flex:none; white-space:nowrap; }
.principal-details { margin-top:8px; }
.principal-details > summary { cursor:pointer; color:var(--link); }
.principal-details pre { margin:7px 0; }
.release-card { background:var(--input); }
.release-card > .mono, .release-card > .principal-details > .mono { padding:8px 10px; background:var(--surface); border-radius:6px; margin:7px 0; }
.release-card > .muted { font-size:12px; margin-top:8px; }
.event-list { max-height:400px; overflow:auto; }
.event-row { display:grid; grid-template-columns:160px minmax(0,1fr); gap:5px 16px; padding:12px 0; border-top:1px solid var(--line); }
.event-row:first-child { border-top:0; padding-top:0; }
.event-other > summary { padding:12px 0; border-top:1px solid var(--line); cursor:pointer; color:var(--muted); font-size:12px; }
.event-time { color:var(--muted); font-size:11px; }
.event-name { font-size:12px; font-weight:550; }
.event-data { grid-column:2; color:var(--muted); }
.cost-toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.period-control { display:flex; align-items:center; gap:9px; font-size:12px; font-weight:500; }
