# hansa's test suite on GitHub's machines. Unlike a sandboxed run, ports on the loopback work here, so the
# tests that serve the web page run too; HANSA_TESTS_NEED_PORTS makes them fail rather than skip if not.
# No secrets: the suite uses stand-ins for claude and srt, and needs no login.
# On macOS the real srt is installed too, and one test runs it with the sandbox settings hansa gives a worker,
# a verifier and a design session (HANSA_TESTS_NEED_SRT makes it fail rather than skip without it): that the
# sandbox starts, leaves open what git needs (the worktree's own folder, a design session's branch ref and
# objects/) and keeps the rest (other worktrees' folders, the shared settings and hooks, other refs, and names
# next to the open ones). The stand-in cannot show how the operating system reads them. Not on Linux: bubblewrap needs unprivileged
# user namespaces, which GitHub's Ubuntu machines restrict (AppArmor) unless the machine's settings are changed.
name: tests

on:
  push:
    branches: [alpha, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.x"]  # the lowest hansa supports, and the newest
    env:
      HANSA_TESTS_NEED_PORTS: "1"
      HANSA_TESTS_NEED_SRT: ${{ startsWith(matrix.os, 'macos') && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install srt, the sandbox runtime (macOS)
        if: runner.os == 'macOS'
        run: npm install -g @anthropic-ai/sandbox-runtime
      - name: Run the tests
        run: python3 -m unittest -v tests.test_hansa
