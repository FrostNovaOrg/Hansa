<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<style>
:root { --bg:#f7f7f4; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e1db; --card:#fff; --accent:#2f5d8a; --warn:#9a5a00; --bad:#b3261e; --ok:#2e7d32; }
@media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecebe6; --muted:#a3a29c; --line:#2f2e2b; --card:#1e1e1c; --accent:#8ab4e0; --warn:#e0a458; --bad:#f28b82; --ok:#81c995; } }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; background:var(--bg); color:var(--fg); }
header { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
nav { display:flex; gap:4px; }
nav button { border:none; background:none; padding:6px 10px; border-radius:6px; color:var(--muted); }
nav button.on { background:var(--bg); color:var(--fg); font-weight:600; }
main { max-width:1100px; margin:0 auto; padding:16px; }
section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:14px; }
h2 { font-size:15px; margin:0 0 8px; }
h3 { font-size:14px; margin:12px 0 6px; }
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:500; border-top:none; white-space:nowrap; }
input, select, textarea { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--fg); max-width:100%; }
input[type=number] { width:90px; }
textarea { width:100%; min-height:84px; font:13px/1.45 ui-monospace,Menlo,monospace; }
button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--fg); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.link { border:none; background:none; color:var(--accent); padding:0; text-decoration:underline; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.grid { display:grid; grid-template-columns: max-content 1fr; gap:6px 12px; align-items:center; }
.muted { color:var(--muted); } .bad { color:var(--bad); } .ok { color:var(--ok); } .warn { color:var(--warn); }
.mono { font:13px/1.45 ui-monospace,Menlo,monospace; }
pre { white-space:pre-wrap; word-break:break-word; margin:0; }
.lane { border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:8px 0; }
.bar { position:sticky; bottom:0; background:var(--bg); padding:10px 0; }
@media (max-width:640px) { main { padding:10px; } .grid { grid-template-columns:1fr; } th, td { padding:5px 4px; } }
</style>
</head>
<body>
<header>
  <strong id="title"></strong>
  <nav id="tabs"></nav>
  <span id="state" class="muted"></span>
</header>
<main>
  <div id="tab-status"></div>
  <div id="tab-settings" hidden></div>
  <div id="tab-cost" hidden></div>
</main>
<script>
"use strict";
const ZH = (navigator.language || "").toLowerCase().startsWith("zh");
const T = ZH ? {
  title:"工作台", status:"状态", settings:"设置", cost:"成本",
  dispatchOn:"正在派活", paused:"已暂停", pause:"暂停派活", resume:"恢复派活", pauseReason:"暂停原因（可不填）",
  serverUp:"后台在运行", serverDown:"后台没在运行：新活不会开始",
  lanes:"工作线", lane:"线", order:"用哪家（按顺序，前一家额度用完换下一家）", now:"现在", free:"空闲", busyWith:"在做",
  running:"正在做", queued:"排队中", waiting:"在等", review:"做完待审", failed:"失败（最近）", minutes:"分钟",
  task:"任务", provider:"供应", titleCol:"内容", changes:"改动", refused:"被拒的命令", error:"原因",
  asks:"智能体提的请求", answer:"回复（可不填）", close:"处理完",
  providers:"模型供应", kind:"类型", subscription:"订阅", compatible:"兼容接口", model:"模型", effort:"思考强度",
  effortDefault:"默认", endpoint:"接口地址", loginDir:"登录目录（空＝默认）", key:"密钥", keySet:"已填", keyMissing:"未填",
  saveKey:"保存密钥", clearKey:"清除密钥", keyHint:"填在这里，只存在本机、谁也看不到内容", check:"检查接口", checking:"检查中…",
  ready:"可用", lastCheck:"上次检查", addProvider:"加一家供应", newName:"名字（小写字母、数字、-）", remove:"删除",
  general:"总体", concurrency:"同时最多做几件", coolMinutes:"额度用完后先歇几分钟", coordinator:"协调席",
  auditsCost:"让协调席参与成本审计", repo:"代码仓路径", base:"基础分支", maxTurns:"每件最多轮数", timeout:"每件最长分钟",
  env:"给执行层的环境变量（每行 名字=值；一般不用动，装了新工具要让执行层找得到时才加）",
  allow:"执行层能跑的命令（每行一条。Bash(pnpm test:*) 的意思是：可以跑以 pnpm test 开头的命令。不在这里的命令一律被拒，被拒的会记在任务详情里）",
  laneCheck:"验收命令：每件活做完后由框架自己在工作树里跑，不经执行层；不通过就不让合并（空＝不验收）", checkCol:"验收", passed:"通过", notPassed:"没通过", checkingWork:"执行层已做完，正在验收",
  providersList:"用哪几家（按顺序，用逗号隔开）", addLane:"加一条线", briefNote:"每条线的常驻说明由协调席写在 lanes/线名/brief.md。",
  prices:"价目（美元／每百万 token）", in:"输入", out:"输出", cacheRead:"读缓存", cacheWrite:"写缓存", cacheWrite1h:"写缓存（1 小时）",
  addPrice:"加一个模型", pricesNote:"缓存价空着就按常见倍数算；第三方模型请填全。",
  save:"保存设置", reload:"放弃修改", saved:"已保存，下一件活起生效。", problems:"没保存，有这些问题：",
  today:"今天", finished:"做完", merged:"已合并", tokens:"token", listValue:"按价目折算",
  days:"最近", daysUnit:"天", total:"合计", unpriced:"这些模型还没有价目：", setPrice:"去“设置”的价目表里填。",
  costNote:"美元按你在设置里填的价目表折算（价目表里没有的 Claude 模型按官方标价）。订阅是按月付费的，这是这些 token 值多少钱，用来比较、找浪费，不是账单。",
  export:"导出表格", byday:"按天", byseat:"按席位", bylane:"按线", bymodel:"按模型", bytask:"按任务", byprovider:"按供应",
  seat_coordinator:"协调席", seat_helper:"协调席的子代理", seat_worker:"执行层",
  events:"最近发生的事", none:"无", detail:"详情", hide:"收起", forbidden:"没有权限：请用 bh web 给的地址打开",
  noPrice:"没价目", tokensNoPrice:"token 没价目"
} : {
  title:"Desk", status:"Status", settings:"Settings", cost:"Cost",
  dispatchOn:"dispatching", paused:"paused", pause:"Pause", resume:"Resume", pauseReason:"reason (optional)",
  serverUp:"server running", serverDown:"server not running: new tasks will not start",
  lanes:"Lanes", lane:"Lane", order:"Providers in order (the next takes over when one runs out)", now:"Now", free:"free", busyWith:"on",
  running:"Running", queued:"Queued", waiting:"waiting", review:"Waiting for review", failed:"Failed (latest)", minutes:"min",
  task:"Task", provider:"Provider", titleCol:"Task", changes:"Changes", refused:"Refused", error:"Why",
  asks:"Requests from agents", answer:"answer (optional)", close:"Done",
  providers:"Providers", kind:"Kind", subscription:"subscription", compatible:"compatible endpoint", model:"Model", effort:"Effort",
  effortDefault:"default", endpoint:"Endpoint", loginDir:"Login directory (blank = default)", key:"Key", keySet:"set", keyMissing:"missing",
  saveKey:"Save key", clearKey:"Clear key", keyHint:"Stored on this machine only; nobody can read it back", check:"Check", checking:"checking…",
  ready:"ready", lastCheck:"last check", addProvider:"Add provider", newName:"name (a-z, 0-9, -)", remove:"Remove",
  general:"General", concurrency:"Tasks at once", coolMinutes:"Rest after a quota error (min)", coordinator:"Coordinator",
  auditsCost:"Let the coordinator audit cost", repo:"Repository path", base:"Base branch", maxTurns:"Max turns per task", timeout:"Max minutes per task",
  env:"Environment for workers (NAME=value per line; rarely needed, e.g. so workers find a tool you installed)",
  allow:"Commands workers may run (one rule per line; Bash(pnpm test:*) means any command starting with pnpm test; anything else is refused and listed on the task)",
  laneCheck:"Check command: bh runs it in the worktree after each task, not the worker; a failed check blocks the merge (blank = none)", checkCol:"Check", passed:"passed", notPassed:"failed", checkingWork:"worker done, checking",
  providersList:"Providers, in order (comma separated)", addLane:"Add lane", briefNote:"The coordinator writes each lane's standing instructions in lanes/<lane>/brief.md.",
  prices:"Prices (USD per million tokens)", in:"Input", out:"Output", cacheRead:"Cache read", cacheWrite:"Cache write", cacheWrite1h:"Cache write (1h)",
  addPrice:"Add model", pricesNote:"Blank cache prices use the usual multiples; fill them in for third-party models.",
  save:"Save settings", reload:"Discard changes", saved:"Saved; applies from the next task.", problems:"Not saved:",
  today:"Today", finished:"finished", merged:"merged", tokens:"tokens", listValue:"priced",
  days:"Last", daysUnit:"days", total:"Total", unpriced:"No price yet for:", setPrice:"Add them under Settings > Prices.",
  costNote:"Dollars use the price table in Settings (a Claude model without an entry uses Claude's list price). Subscriptions are paid monthly: this is what the tokens are worth, for comparing and spotting waste, not a bill.",
  export:"Export CSV", byday:"By day", byseat:"By seat", bylane:"By lane", bymodel:"By model", bytask:"By task", byprovider:"By provider",
  seat_coordinator:"coordinator", seat_helper:"coordinator's helpers", seat_worker:"workers",
  events:"Recent events", none:"none", detail:"details", hide:"hide", forbidden:"Forbidden: open the address printed by bh web",
  noPrice:"no price", tokensNoPrice:"tokens without a price"
};
const EFFORTS = ["", "low", "medium", "high", "xhigh", "max"];
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const section = (title, ...kids) => h("section", {}, h("h2", {}, title), ...kids);
const table = (head, rows) => h("div", {class:"scroll"}, h("table", {}, h("tr", {}, head.map(x => h("th", {}, x))),
  rows.map(r => h("tr", {}, r.map(c => h("td", {}, c))))));
const fmt = n => (n || 0).toLocaleString();
const when = ts => ts ? new Date(ts * 1000).toLocaleString() : "";
async function api(path, body) {
  const opt = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json", "X-BH":"1"}, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  if (r.status === 403) throw new Error(T.forbidden);
  return r.json();
}

/* ---------- tabs ---------- */
let current = "status";
function show(tab) {
  current = tab;
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  for (const t of ["status", "settings", "cost"]) $("#tab-" + t).hidden = t !== tab;
  ({status:loadStatus, settings:loadSettings, cost:loadCost})[tab]().catch(err);
}
function err(e) { $("#state").textContent = String(e.message || e); $("#state").className = "bad"; }

/* ---------- status ---------- */
const detailOpen = new Set();
function taskLink(id) {
  const box = h("div", {class:"mono", hidden:!detailOpen.has(id)});
  const load = async () => { box.replaceChildren(h("pre", {}, (await api("/api/task?id=" + id)).text)); };
  if (detailOpen.has(id)) load().catch(err);
  const btn = h("button", {class:"link", onclick: () => {
    if (detailOpen.has(id)) { detailOpen.delete(id); box.hidden = true; }
    else { detailOpen.add(id); box.hidden = false; load().catch(err); }
  }}, id);
  return [btn, box];
}
async function loadStatus() {
  const [st, ev] = await Promise.all([api("/api/status"), api("/api/events")]);
  $("#state").textContent = (st.paused ? T.paused + ": " + st.paused : T.dispatchOn) + " · " + (st.server_up ? T.serverUp : T.serverDown);
  $("#state").className = (st.paused || !st.server_up) ? "warn" : "muted";
  const reason = h("input", {placeholder:T.pauseReason});
  const t = st.today;
  $("#tab-status").replaceChildren(
    h("section", {}, h("div", {class:"row"},
      st.paused ? h("button", {class:"primary", onclick: () => api("/api/resume", {}).then(loadStatus).catch(err)}, T.resume)
                : [reason, h("button", {onclick: () => api("/api/pause", {reason:reason.value}).then(loadStatus).catch(err)}, T.pause)],
      h("span", {class:"muted"}, `${T.today}: ${t.finished} ${T.finished} · ${t.merged} ${T.merged} · ${fmt(t.worker_tokens)} ${T.tokens} · $${t.worker_usd.toFixed(2)} ${T.listValue}`))),
    section(T.lanes, table([T.lane, T.order, T.now], st.lanes.map(l => [l.name, l.providers.join(" → "), l.task ? [T.busyWith + " ", taskLink(l.task)] : T.free]))),
    st.running.length ? section(T.running, table([T.task, T.lane, T.provider, T.minutes, T.titleCol],
      st.running.map(m => [taskLink(m.id), m.lane, m.checking ? T.checkingWork : `${m.provider} (${m.model})`, m.minutes, m.title]))) : null,
    st.queued.length ? section(T.queued, table([T.task, T.lane, T.titleCol, T.waiting],
      st.queued.map(m => [taskLink(m.id), m.lane, m.title, h("span", {class:"muted"}, m.waiting)]))) : null,
    st.review.length ? section(T.review, table([T.task, T.lane, T.titleCol, T.changes, T.checkCol, T.refused],
      st.review.map(m => [taskLink(m.id), m.lane, m.title, m.stat || T.none,
        m.check == null ? "—" : h("span", {class: m.check ? "ok" : "bad"}, m.check ? T.passed : T.notPassed),
        m.denied ? h("span", {class:"warn"}, m.denied) : "0"]))) : null,
    st.failed.length ? section(T.failed, table([T.task, T.lane, T.titleCol, T.error],
      st.failed.map(m => [taskLink(m.id), m.lane, m.title, h("span", {class:"bad"}, m.error)]))) : null,
    st.asks.length ? section(T.asks, st.asks.map(a => {
      const ans = h("input", {placeholder:T.answer, style:"flex:1"});
      return h("div", {class:"row", style:"margin:6px 0"}, h("strong", {}, "#" + a.id), h("span", {}, a.text), ans,
        h("button", {onclick: () => api("/api/ask/close", {id:a.id, answer:ans.value}).then(loadStatus).catch(err)}, T.close));
    })) : null,
    section(T.providers, table([T.provider, T.kind, T.model, T.now, T.lastCheck, ""], st.providers.map(p => [
      p.name, p.kind === "subscription" ? T.subscription : T.compatible, p.model + (p.effort ? " · " + p.effort : ""),
      p.problem ? h("span", {class:"warn"}, p.problem) : h("span", {class:"ok"}, T.ready),
      p.check ? h("span", {class: p.check.ok ? "ok" : "bad"}, `${p.check.ok ? "OK" : "✗"} ${p.check.detail} (${when(p.check.at)})`) : "",
      checkButton(p.name, loadStatus)]))),
    section(T.events, h("div", {class:"mono"}, ev.slice(0, 20).map(e => h("div", {}, `${when(e.ts)}  ${e.event}  ` +
      Object.entries(e).filter(([k]) => k !== "ts" && k !== "event").map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ")))))
  );
}
function checkButton(name, after) {
  const b = h("button", {onclick: async () => { b.disabled = true; b.textContent = T.checking;
    let r = null;
    try { r = await api("/api/check", {provider:name}); } catch (e) { err(e); }
    if (after) return after(r);
    b.disabled = false; b.textContent = r ? `${T.check}: ${r.ok ? "OK" : "✗"} ${r.detail}` : T.check;
    b.className = r && r.ok ? "ok" : "bad"; }}, T.check);
  return b;
}

/* ---------- settings ---------- */
let S = null, KEYS = {};
async function loadSettings(problems) {
  const r = await api("/api/settings");
  S = r.settings; KEYS = r.keys;
  renderSettings(problems && problems.length ? problems : r.problems);
}
function bind(obj, key, kind) {
  const set = el => {
    if (kind === "number") { if (el.value === "") delete obj[key]; else obj[key] = Number(el.value); }
    else if (kind === "bool") obj[key] = el.checked;
    else obj[key] = el.value;
  };
  if (kind === "bool") return h("input", {type:"checkbox", checked:obj[key], onchange: e => set(e.target)});
  return h("input", {type: kind === "number" ? "number" : "text", value: obj[key] ?? "", oninput: e => set(e.target), step:"any"});
}
function pick(obj, key, options, labels) {
  return h("select", {onchange: e => { obj[key] = e.target.value; }},
    options.map((o, i) => h("option", {value:o, selected: (obj[key] || "") === o}, labels ? labels[i] : (o || T.effortDefault))));
}
function linesArea(obj, key, toText, fromText) {
  return h("textarea", {value: toText(obj[key]), oninput: e => { obj[key] = fromText(e.target.value); }});
}
function renderSettings(problems) {
  const newProv = h("input", {placeholder:T.newName});
  const newLane = h("input", {placeholder:T.newName});
  const newRepo = h("input", {placeholder:"/path/to/repo", style:"min-width:260px"});
  const newPrice = h("input", {placeholder:"model"});
  const msg = h("span", {});
  $("#tab-settings").replaceChildren(
    problems && problems.length ? section(T.problems, h("ul", {}, problems.map(p => h("li", {class:"bad"}, p)))) : null,
    section(T.providers,
      Object.entries(S.providers).map(([name, p]) => {
        const keyBox = h("input", {type:"password", placeholder:T.keyHint, autocomplete:"off", style:"min-width:240px"});
        const kindSel = pick(p, "kind", ["subscription", "compatible"], [T.subscription, T.compatible]);
        kindSel.addEventListener("change", () => renderSettings());
        return h("div", {class:"lane"},
          h("div", {class:"row"}, h("strong", {}, name), checkButton(name, null),
            h("button", {onclick: () => { delete S.providers[name]; renderSettings(); }}, T.remove)),
          h("div", {class:"grid"},
            T.kind, kindSel, T.model, bind(p, "model"), T.effort, pick(p, "effort", EFFORTS),
            ...(p.kind === "compatible"
              ? [T.endpoint, bind(p, "base_url"), T.key, h("div", {class:"row"},
                  h("span", {class: KEYS[name] ? "ok" : "warn"}, KEYS[name] ? T.keySet : T.keyMissing), keyBox,
                  h("button", {onclick: () => api("/api/key", {provider:name, key:keyBox.value})
                    .then(r => { if (r.ok === false) return renderSettings(r.problems);
                      KEYS[name] = !!keyBox.value.trim(); renderSettings(); }).catch(err)}, T.saveKey),
                  KEYS[name] ? h("button", {onclick: () => api("/api/key", {provider:name, key:""})
                    .then(() => { KEYS[name] = false; renderSettings(); }).catch(err)}, T.clearKey) : null)]
              : [T.loginDir, bind(p, "config_dir")])));
      }),
      h("div", {class:"row"}, newProv, h("button", {onclick: () => { const n = newProv.value.trim();
        if (n && !S.providers[n]) { S.providers[n] = {kind:"compatible", model:"", effort:"", base_url:""}; renderSettings(); } }}, T.addProvider))),
    section(T.lanes, h("p", {class:"muted"}, T.briefNote),
      Object.entries(S.lanes).map(([name, l]) => h("div", {class:"lane"},
        h("div", {class:"row"}, h("strong", {}, name), h("button", {onclick: () => { delete S.lanes[name]; renderSettings(); }}, T.remove)),
        h("div", {class:"grid"},
          T.repo, bind(l, "repo"), T.base, bind(l, "base"),
          T.providersList, h("input", {value:(l.providers || []).join(", "), oninput: e => { l.providers = e.target.value.split(",").map(x => x.trim()).filter(Boolean); }}),
          T.maxTurns, bind(l, "max_turns", "number"), T.timeout, bind(l, "timeout_min", "number")),
        h("h3", {}, T.env), linesArea(l, "env", v => Object.entries(v || {}).map(([k, x]) => `${k}=${x}`).join("\n"),
          t => Object.fromEntries(t.split("\n").map(x => x.trim()).filter(Boolean).map(x => [x.split("=")[0].trim(), x.slice(x.indexOf("=") + 1).trim()]))),
        h("h3", {}, T.allow), linesArea(l, "allow", v => (v || []).join("\n"), t => t.split("\n").map(x => x.trim()).filter(Boolean)),
        h("h3", {}, T.laneCheck), h("input", {value: l.check || "", style:"width:100%",
          oninput: e => { const v = e.target.value.trim(); if (v) l.check = v; else delete l.check; }}))),
      h("div", {class:"row"}, newLane, newRepo, h("button", {onclick: () => { const n = newLane.value.trim();
        if (n && !S.lanes[n]) { S.lanes[n] = {repo:newRepo.value.trim(), base:"main", providers:Object.keys(S.providers).slice(0, 1),
          allow:["Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)", "Bash(git add:*)", "Bash(git commit:*)", "Bash(ls:*)"],
          env:{}, max_turns:80, timeout_min:60}; renderSettings(); } }}, T.addLane))),
    section(T.general, h("div", {class:"grid"},
      T.concurrency, bind(S, "concurrency", "number"), T.coolMinutes, bind(S, "cool_minutes", "number"),
      T.coordinator, h("div", {class:"row"}, pick(S.coordinator, "provider", Object.keys(S.providers), Object.keys(S.providers)),
        T.model, bind(S.coordinator, "model"), T.effort, pick(S.coordinator, "effort", EFFORTS)),
      T.auditsCost, bind(S.coordinator, "audits_cost", "bool"))),
    section(T.prices, h("p", {class:"muted"}, T.pricesNote),
      table([T.model, T.in, T.out, T.cacheRead, T.cacheWrite, T.cacheWrite1h, ""], Object.entries(S.prices).map(([m, p]) =>
        [m, bind(p, "in", "number"), bind(p, "out", "number"), bind(p, "cache_read", "number"), bind(p, "cache_write", "number"),
         bind(p, "cache_write_1h", "number"), h("button", {onclick: () => { delete S.prices[m]; renderSettings(); }}, T.remove)])),
      h("div", {class:"row"}, newPrice, h("button", {onclick: () => { const n = newPrice.value.trim();
        if (n && !S.prices[n]) { S.prices[n] = {in:0, out:0}; renderSettings(); } }}, T.addPrice))),
    h("div", {class:"row bar"},
      h("button", {class:"primary", onclick: async () => {
        try { const r = await api("/api/settings", {settings:S});
          if (r.ok) { await loadSettings(); msg.textContent = T.saved; msg.className = "ok"; $("#tab-settings").append(msg); }
          else { renderSettings(r.problems); window.scrollTo(0, 0); } } catch (e) { err(e); } }}, T.save),
      h("button", {onclick: () => loadSettings()}, T.reload), msg)
  );
}

/* ---------- cost ---------- */
let costDays = 7;
async function loadCost() {
  const r = await api("/api/cost?days=" + costDays);
  const seatName = k => T["seat_" + k] || k;
  const block = key => {
    const rows = Object.entries(r.by[key] || {});
    if (!rows.length) return null;
    return h("div", {}, h("h3", {}, T["by" + key]), table(["", T.tokens, "$ " + T.listValue, T.tokensNoPrice],
      rows.map(([k, v]) => [key === "seat" ? seatName(k) : (k || "-"), fmt(v.tokens), v.usd.toFixed(2), v.unpriced_tokens ? fmt(v.unpriced_tokens) : ""])));
  };
  $("#tab-cost").replaceChildren(
    h("section", {},
      h("div", {class:"row"}, T.days, pick({d:String(costDays)}, "d", ["1", "7", "30"], ["1", "7", "30"]), T.daysUnit,
        h("strong", {}, `${T.total}: ${fmt(r.total.tokens)} ${T.tokens} · $${r.total.usd.toFixed(2)} ${T.listValue}`),
        h("button", {onclick: exportCsv}, T.export)),
      h("p", {class:"muted"}, T.costNote),
      r.unpriced_models.length ? h("p", {class:"warn"}, T.unpriced + " " + r.unpriced_models.join(", ") + " — " + T.setPrice) : null),
    section(T.cost, ["seat", "day", "model", "lane", "provider", "task"].map(block)));
  const sel = $("#tab-cost select");
  sel.addEventListener("change", e => { costDays = Number(e.target.value); loadCost().catch(err); });
}
async function exportCsv() {
  const r = await api(`/api/cost?days=${costDays}&rows=1`);
  const cols = ["day", "seat", "lane", "task", "provider", "model", "in", "out", "cache_read", "cache_write", "usd", "priced_by"];
  const esc = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [cols.join(",")].concat(r.rows.map(x => cols.map(c => esc(x[c])).join(","))).join("\n");
  const a = h("a", {href:URL.createObjectURL(new Blob([csv], {type:"text/csv"})), download:`cost-${costDays}d.csv`});
  document.body.append(a); a.click(); a.remove();
}

/* ---------- start ---------- */
document.title = T.title;
$("#title").textContent = T.title;
for (const tab of ["status", "settings", "cost"])
  $("#tabs").append(h("button", {"data-tab":tab, onclick: () => show(tab)}, T[tab]));
if (location.search.includes("t=")) history.replaceState(null, "", "/");
show("status");
setInterval(() => {
  const typing = $("#tab-status").contains(document.activeElement) && document.activeElement.tagName === "INPUT";
  if (current === "status" && !document.hidden && !typing) loadStatus().catch(err);
}, 5000);
</script>
